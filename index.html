<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<title>KasirKu — POS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============ RESET & VARIABEL ============ */
:root{
  --bg:#e0e5ec; --text:#2d3436; --muted:#7a8a99;
  --shadow-dark:#a3b1c6; --shadow-light:#ffffff;
  --accent:#ff6b35; --accent-hover:#e55a2b;
  --card-bg:#e0e5ec; --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#1e222a; --text:#e6ebf2; --muted:#8a96a8;
  --shadow-dark:#14171c; --shadow-light:#2a3038;
  --card-bg:#1e222a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  padding-bottom:110px; min-height:100vh; overflow-x:hidden;
  transition:background .3s,color .3s;
}
/* ============ HEADER + CLOCK (diperkecil) ============ */
.app-header{padding:20px 16px 12px;text-align:center;}
.app-header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.5px;}
.header-sub{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
.clock-display{
  margin-top:10px;display:inline-flex;flex-direction:column;align-items:center;
  padding:7px 16px;border-radius:12px;background:var(--card-bg);
  box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);
}
.clock-time{
  font-family:'Courier New',monospace;font-size:1.35rem;font-weight:800;
  letter-spacing:2px;color:var(--accent);
  text-shadow:0 0 10px rgba(255,107,53,.3);
  transition:color .3s;
}
.clock-date{font-size:.65rem;color:var(--muted);letter-spacing:1px;margin-top:1px;text-transform:uppercase;font-weight:600;}
/* ============ VIEW ============ */
.view{display:none;padding:0 16px;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
h2{font-size:1.3rem;margin:16px 0 12px;font-weight:700;}
h3{font-size:1rem;margin-bottom:10px;}
/* ============ SKEUO CARD ============ */
.skeuo-card{
  background:var(--card-bg);border-radius:var(--radius);
  box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);
  padding:20px;margin-bottom:16px;
}
/* ============ DASHBOARD ============ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.stat-value{font-size:1.35rem;font-weight:800;color:var(--accent);}
.stat-hint{font-size:.62rem;color:var(--accent);margin-top:2px;opacity:.75;font-weight:600;}
.stat-card.clickable{cursor:pointer;transition:transform .15s ease;}
.stat-card.clickable:active{transform:scale(.97);}
.chart-container{position:relative;height:220px;padding:12px;}
.chart-switch{display:flex;gap:8px;margin-bottom:12px;}
.chart-switch button{
  flex:1;padding:8px;border:none;border-radius:10px;background:var(--card-bg);
  box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
  font-weight:600;font-size:.8rem;color:var(--text);cursor:pointer;
}
.chart-switch button.active{
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
  color:var(--accent);
}
/* ============ KASIR CATEGORY TABS ============ */
.kasir-cat-tabs{display:flex;gap:8px;margin-bottom:12px;}
.kasir-cat-tab{
  flex:1;padding:9px 6px;border:none;border-radius:10px;background:var(--card-bg);
  box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
  font-weight:600;font-size:.78rem;cursor:pointer;color:var(--text);
  transition:all .15s;
}
.kasir-cat-tab.active{
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
  color:var(--accent);
}
/* ============ PRODUK GRID ============ */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px;}
.product-card{
  background:var(--card-bg);border-radius:12px;padding:14px;cursor:pointer;
  box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);
  transition:all .12s ease;text-align:center;
}
.product-card:active{box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);}
.p-name{font-weight:600;font-size:.85rem;line-height:1.2;}
.p-price{color:var(--accent);font-weight:700;font-size:.85rem;margin-top:6px;}
.p-cat{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
/* ============ CART ============ */
#cart-items{list-style:none;max-height:200px;overflow-y:auto;}
#cart-items li{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:.88rem;gap:8px;
}
.cart-item-info{flex:1;}
.cart-item-qty{display:flex;align-items:center;gap:6px;}
.qty-btn{
  width:26px;height:26px;border:none;border-radius:50%;background:var(--card-bg);
  box-shadow:3px 3px 6px var(--shadow-dark),-3px -3px 6px var(--shadow-light);
  font-weight:800;cursor:pointer;color:var(--text);
}
.qty-btn:active{box-shadow:inset 2px 2px 4px var(--shadow-dark),inset -2px -2px 4px var(--shadow-light);}
.cart-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:16px 0;}
.cart-total{
  display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;
  margin:12px 0;padding-top:10px;border-top:2px solid var(--accent);
}
.payment-methods{display:flex;gap:10px;margin-bottom:12px;}
.pay-btn{
  flex:1;padding:12px;border:none;border-radius:10px;background:var(--card-bg);
  box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
  font-weight:600;cursor:pointer;color:var(--text);font-size:.9rem;
}
.pay-btn.active{
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
  color:var(--accent);
}
/* ============ BUTTONS & INPUTS ============ */
.skeuo-btn{
  background:var(--card-bg);border:none;border-radius:12px;padding:12px 20px;
  font-weight:700;color:var(--text);cursor:pointer;font-size:.9rem;
  box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);
  transition:all .1s;
}
.skeuo-btn:active{box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);}
.skeuo-btn:disabled{opacity:.4;cursor:not-allowed;}
.skeuo-btn.accent{background:var(--accent);color:#fff;}
.skeuo-btn.accent:active{box-shadow:inset 4px 4px 8px rgba(0,0,0,.3);}
.skeuo-btn.block{width:100%;padding:14px;font-size:1rem;text-transform:uppercase;letter-spacing:1px;}
.skeuo-btn.danger{color:#e74c3c;}
.skeuo-input{
  width:100%;padding:12px;border:none;border-radius:10px;background:var(--card-bg);
  box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);
  font-family:var(--font);font-size:.95rem;margin-bottom:12px;color:var(--text);
}
.skeuo-input:focus{outline:2px solid var(--accent);}
select.skeuo-input{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237a8a99'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:20px;padding-right:36px;
}
.settings-card label, .modal label{display:block;font-size:.75rem;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
/* ============ COLOR PICKER ============ */
.color-picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.color-swatch{
  width:42px;height:42px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;padding:0;
  box-shadow:3px 3px 6px var(--shadow-dark),-3px -3px 6px var(--shadow-light);
  transition:transform .15s,border-color .15s;
}
.color-swatch:hover{transform:scale(1.08);}
.color-swatch.active{border-color:var(--text);transform:scale(1.12);}
#custom-color{
  width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;padding:0;background:none;
}
#custom-color::-webkit-color-swatch-wrapper{padding:0;}
#custom-color::-webkit-color-swatch{border:3px solid var(--shadow-dark);border-radius:50%;}
/* ============ MENU LIST ============ */
.menu-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px;margin-bottom:10px;background:var(--card-bg);border-radius:12px;
  box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);
}
.menu-item .info{flex:1;min-width:0;}
.menu-item strong{display:block;font-size:.9rem;margin-bottom:2px;}
.menu-item .price{color:var(--accent);font-weight:700;font-size:.85rem;}
.menu-item .cat-tag{
  display:inline-block;font-size:.65rem;padding:2px 8px;border-radius:8px;
  background:var(--bg);color:var(--muted);margin-top:4px;
  box-shadow:inset 1px 1px 2px var(--shadow-dark),inset -1px -1px 2px var(--shadow-light);
}
.menu-item .actions{display:flex;gap:6px;}
.menu-item .actions button{padding:8px 10px;font-size:.75rem;}
/* ============ FLOATING NOTCH TAB BAR ============ */
.floating-tab-bar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:420px;height:70px;
  background:var(--card-bg);border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 8px;z-index:1000;
}
.tab-bar-notch{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  width:60px;height:24px;background:var(--card-bg);
  border-radius:0 0 30px 30px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  pointer-events:none;z-index:1;
}
.tab-item{
  position:relative;z-index:2;background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);cursor:pointer;padding:8px 12px;border-radius:14px;
  transition:all .2s;font-size:1.3rem;
}
.tab-item span{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.tab-item.active{
  color:var(--accent);
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
}
/* ============ TOAST & MODAL ============ */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:#2d3436;color:#fff;padding:10px 18px;border-radius:10px;
  font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;
  box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:85%;text-align:center;
  pointer-events:none;
}
#toast.show{opacity:1;}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--bg);border-radius:20px;padding:24px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:90vh;overflow-y:auto;
}
.modal h3{margin-bottom:16px;font-size:1.1rem;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.modal-actions button{flex:1;}
/* ============ SOLD DETAIL MODAL ============ */
.sold-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.sold-stat{
  padding:12px;background:var(--card-bg);border-radius:10px;text-align:center;
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
}
.sold-stat span{display:block;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:700;}
.sold-stat strong{font-size:1rem;color:var(--accent);}
.sold-list{max-height:320px;overflow-y:auto;margin-bottom:16px;padding-right:2px;}
.sold-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.sold-item:last-child{border-bottom:none;}
.sold-rank{
  width:28px;height:28px;border-radius:50%;background:var(--bg);flex-shrink:0;
  box-shadow:inset 2px 2px 4px var(--shadow-dark),inset -2px -2px 4px var(--shadow-light);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:800;color:var(--accent);
}
.sold-info{flex:1;min-width:0;}
.sold-name{font-weight:600;font-size:.9rem;line-height:1.2;}
.sold-meta{font-size:.72rem;color:var(--muted);margin-top:2px;}
.sold-total{font-weight:700;color:var(--accent);font-size:.85rem;white-space:nowrap;}
/* ============ CASH PAYMENT (Kembalian diperbesar) ============ */
.cash-total-box{
  display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;
  margin-bottom:16px;padding:12px 14px;background:var(--card-bg);border-radius:10px;
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
}
.cash-total-box .amount{color:var(--accent);}
.change-box{
  display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1rem;
  padding:12px 16px;background:var(--card-bg);border-radius:10px;margin-bottom:16px;
  box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
}
#change-amount{
  color:#10b981;font-size:1.65rem;font-weight:900;
  letter-spacing:-.5px;line-height:1.1;
}
.suggestion-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.suggestion-btn{
  padding:8px 12px;font-size:.78rem;border:none;border-radius:10px;
  background:var(--card-bg);color:var(--text);cursor:pointer;font-weight:600;
  box-shadow:3px 3px 6px var(--shadow-dark),-3px -3px 6px var(--shadow-light);
}
.suggestion-btn:active{box-shadow:inset 2px 2px 4px var(--shadow-dark),inset -2px -2px 4px var(--shadow-light);}
/* ============ LOADING OVERLAY ============ */
.loading-overlay{
  position:fixed;inset:0;z-index:5000;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px) saturate(140%);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
}
.loading-overlay.show{display:flex;animation:fadeIn .2s ease;}
.spinner{
  width:56px;height:56px;border-radius:50%;
  border:4px solid rgba(255,255,255,.25);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{
  color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.5px;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}
/* ============ RESPONSIVE ============ */
@media (min-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr 1fr;}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .floating-tab-bar{width:420px;}
}
</style>
</head>
<body>

<header class="app-header">
  <h1 id="store-name">KasirKu</h1>
  <span class="header-sub"></span>
  <div class="clock-display">
    <div class="clock-time" id="clock-time">00:00:00</div>
    <div class="clock-date" id="clock-date">-</div>
  </div>
</header>

<main id="app-content">
  <!-- ============ DASHBOARD ============ -->
  <section id="view-dashboard" class="view active">
    <h2>Dashboard</h2>
    <div class="stats-grid">
      <div class="stat-card skeuo-card">
        <span class="stat-label">Hari Ini</span>
        <span class="stat-value" id="stat-today">Rp 0</span>
      </div>
      <div class="stat-card skeuo-card clickable" id="stat-tx-card" title="Ketuk untuk detail produk terjual">
        <span class="stat-label">Transaksi</span>
        <span class="stat-value" id="stat-tx-today">0</span>
        <span class="stat-hint">Ketuk untuk detail →</span>
      </div>
      <div class="stat-card skeuo-card" style="grid-column:span 2;">
        <span class="stat-label">Total Keseluruhan</span>
        <span class="stat-value" id="stat-total">Rp 0</span>
      </div>
    </div>
    <div class="skeuo-card">
      <div class="chart-switch">
        <button class="active" data-range="daily">Harian</button>
        <button data-range="monthly">Bulanan</button>
      </div>
      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </section>

  <!-- ============ KASIR ============ -->
  <section id="view-cashier" class="view">
    <h2>Kasir</h2>
    <div class="kasir-cat-tabs">
      <button class="kasir-cat-tab active" data-cat="all">Semua</button>
      <button class="kasir-cat-tab" data-cat="Makanan">🍔 Makanan</button>
      <button class="kasir-cat-tab" data-cat="Minuman">🥤 Minuman</button>
    </div>
    <div class="product-grid" id="product-list"></div>
    <div class="skeuo-card" id="cart-panel">
      <h3>🛒 Keranjang</h3>
      <ul id="cart-items"><li class="cart-empty">Belum ada item</li></ul>
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">Rp 0</span>
      </div>
      <div class="payment-methods">
        <button class="pay-btn active" data-method="Tunai">💵 Tunai</button>
        <button class="pay-btn" data-method="QRIS">📱 QRIS</button>
      </div>
      <button class="skeuo-btn accent block" id="checkout-btn">Bayar</button>
    </div>
  </section>

  <!-- ============ MENU ============ -->
  <section id="view-menu" class="view">
    <h2>Kelola Menu</h2>
    <button class="skeuo-btn accent block" id="add-product-btn" style="margin-bottom:16px;">+ Tambah Produk</button>
    <div id="menu-list"></div>
  </section>

  <!-- ============ PENGATURAN ============ -->
  <section id="view-settings" class="view">
    <h2>Pengaturan</h2>
    <div class="skeuo-card settings-card">
      <label for="input-store-name">Nama Toko</label>
      <input type="text" id="input-store-name" class="skeuo-input" placeholder="KasirKu">

      <label for="select-theme">Tema</label>
      <select id="select-theme" class="skeuo-input">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>

      <label>Warna Aksen</label>
      <div class="color-picker" id="color-picker">
        <button class="color-swatch" data-color="#ff6b35" style="background:#ff6b35" title="Orange"></button>
        <button class="color-swatch" data-color="#3b82f6" style="background:#3b82f6" title="Biru"></button>
        <button class="color-swatch" data-color="#10b981" style="background:#10b981" title="Hijau"></button>
        <button class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6" title="Ungu"></button>
        <button class="color-swatch" data-color="#ec4899" style="background:#ec4899" title="Pink"></button>
        <button class="color-swatch" data-color="#ef4444" style="background:#ef4444" title="Merah"></button>
        <input type="color" id="custom-color" value="#ff6b35" title="Warna kustom">
      </div>

      <button class="skeuo-btn accent block" id="save-settings-btn">Simpan Pengaturan</button>
    </div>
    <div class="skeuo-card">
      <label style="display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">Aplikasi Buatan AI</label>
      <p id="api-status" style="font-size:.8rem;color:var(--muted);">Memeriksa...</p>
    </div>
  </section>
</main>

<nav class="floating-tab-bar">
  <div class="tab-bar-notch"></div>
  <button class="tab-item active" data-view="dashboard">📊<span>Dashboard</span></button>
  <button class="tab-item" data-view="cashier">🛒<span>Kasir</span></button>
  <button class="tab-item" data-view="menu">📋<span>Menu</span></button>
  <button class="tab-item" data-view="settings">⚙️<span>Atur</span></button>
</nav>

<div id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Memproses...</div>
</div>

<script>
/* ==========================================
   KONFIGURASI
   ========================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycby5uKavl82rPKapv7Nc_REeB_-Tb7LmHg11kWde-2e-kePhPPEXZPNLevDXGBNAO08F/exec';

/* ==========================================
   STATE
   ========================================== */
const state = {
  products: [],
  cart: [],
  paymentMethod: 'Tunai',
  settings: { Nama_Toko: 'KasirKu', Tema: 'light', Accent: '#ff6b35' },

/* ==========================================
   UTILITAS
   ========================================== */
function formatRupiah(n){return 'Rp ' + Number(n||0).toLocaleString('id-ID');}
function formatNumberInput(val){
  const digits = String(val||'').replace(/\D/g, '');
  if (!digits) return '';
  return Number(digits).toLocaleString('id-ID');
}
function parseNumberInput(val){
  return Number(String(val||'').replace(/\D/g, '')) || 0;
}
function showToast(msg, duration = 3000){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), duration);
}
function showLoading(text){
  document.getElementById('loading-text').textContent = text || 'Memproses...';
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading(){
  document.getElementById('loading-overlay').classList.remove('show');
}
function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') closeModal();
});
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ==========================================
   TIMEZONE-AWARE HELPERS
   ========================================== */
function localDateKey(d){
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function localMonthKey(d){
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
}
function isSameLocalDay(isoStr, refDate = new Date()){
  return localDateKey(isoStr) === localDateKey(refDate);
}
function isSameLocalMonth(isoStr, refDate = new Date()){
  return localMonthKey(isoStr) === localMonthKey(refDate);
}

/* ==========================================
   JAM DIGITAL
   ========================================== */
function initClock(){
  function update(){
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('clock-time').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    document.getElementById('clock-date').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
  }
  update();
  setInterval(update, 1000);
}

/* ==========================================
   ACCENT COLOR
   ========================================== */
function darkenHex(hex, pct){
  const num = parseInt(String(hex).replace('#',''), 16);
  const r = Math.max(0, Math.floor((num >> 16) * (1 - pct)));
  const g = Math.max(0, Math.floor(((num >> 8) & 0xff) * (1 - pct)));
  const b = Math.max(0, Math.floor((num & 0xff) * (1 - pct)));
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}
function applyAccent(color){
  if (!color) return;
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-hover', darkenHex(color, .15));
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', (s.dataset.color||'').toLowerCase() === color.toLowerCase());
  });
  const custom = document.getElementById('custom-color');
  if (custom) custom.value = color;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', color);
}

/* ==========================================
   API CLIENT
   ========================================== */
async function apiGet(action, params = {}){
  try{
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    const res = await fetch(url.toString(), {redirect:'follow'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err){
    console.warn('[API GET ' + action + ']', err.message);
    return { success:false, message:err.message, data:[] };
  }
}
async function apiPost(action, payload){
  try{
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    const res = await fetch(url.toString(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, ...payload }),
      redirect:'follow'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err){
    console.warn('[API POST ' + action + ']', err.message);
    return { success:false, message:err.message };
  }
}

/* ==========================================
   NAVIGASI
   ========================================== */
function setupNavigation(){
  document.querySelectorAll('.tab-item').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const view = btn.dataset.view;
      const target = document.getElementById('view-' + view);
      if (!target){ console.warn('View tidak ada:', view); return; }
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      target.classList.add('active');
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (view === 'dashboard') { renderDashboard(); renderChart(); }
      if (view === 'cashier') { renderProducts(); renderCart(); }
      if (view === 'menu') { renderMenu(); }
      if (view === 'settings') { syncSettingsUI(); }
    });
  });
}

/* ==========================================
   INIT
   ========================================== */
document.addEventListener('DOMContentLoaded', async () => {
  setupNavigation();
  setupOtherEvents();
  initClock();
  applyTheme(state.settings.Tema);
  applyAccent(state.settings.Accent);

  const apiStatusEl = document.getElementById('api-status');
  if (!API_URL || API_URL.includes('XXXXX')){
    state.apiReady = false;
    if (apiStatusEl) apiStatusEl.innerHTML = '⚠️ <b>API_URL belum diset.</b>';
    showToast('⚠️ API belum dikonfigurasi. Mode offline.', 5000);
    renderAll();
    return;
  }

  try{
    await loadSettings();
    await loadProducts();
    await loadTransactions();
    state.apiReady = true;
    if (apiStatusEl) apiStatusEl.innerHTML = '✅ Created By : Awal';
  } catch(err){
    console.error('Load error:', err);
    if (apiStatusEl) apiStatusEl.innerHTML = '❌ Gagal terhubung: ' + err.message;
  }
  renderAll();
});

function renderAll(){
  renderDashboard();
  renderChart();
  renderProducts();
  renderCart();
  renderMenu();
}

/* ==========================================
   LOAD DATA
   ========================================== */
async function loadSettings(){
  const res = await apiGet('getSettings');
  if (res.success && res.data){
    state.settings = { ...state.settings, ...res.data };
    applyTheme(state.settings.Tema);
    applyAccent(state.settings.Accent || '#ff6b35');
    document.getElementById('store-name').textContent = state.settings.Nama_Toko || 'Kasirku';
    syncSettingsUI();
  }
}
function syncSettingsUI(){
  document.getElementById('input-store-name').value = state.settings.Nama_Toko || '';
  document.getElementById('select-theme').value = state.settings.Tema || 'light';
  applyAccent(state.settings.Accent || '#ff6b35');
}
async function loadProducts(){
  const res = await apiGet('getProducts');
  if (res.success && Array.isArray(res.data)){
    state.products = res.data.filter(p => String(p.Status||'Aktif').toLowerCase() === 'aktif');
  }
}
async function loadTransactions(){
  const res = await apiGet('getTransactions');
  if (res.success && Array.isArray(res.data)){
    state.transactions = res.data;
  }
}

/* ==========================================
   DASHBOARD
   ========================================== */
function renderDashboard(){
  const todayTx = state.transactions.filter(tx => isSameLocalDay(String(tx.Tanggal||'')));
  const totalToday = todayTx.reduce((s, tx) => s + Number(tx.Total||0), 0);
  const totalAll = state.transactions.reduce((s, tx) => s + Number(tx.Total||0), 0);

  document.getElementById('stat-today').textContent = formatRupiah(totalToday);
  document.getElementById('stat-tx-today').textContent = todayTx.length;
  document.getElementById('stat-total').textContent = formatRupiah(totalAll);
  updateTxCardHint();
}

/* ==========================================
   DETAIL PRODUK TERJUAL
   ========================================== */
function getSoldProducts(range){
  const txs = state.transactions.filter(tx => {
    const tgl = String(tx.Tanggal || '');
    return range === 'daily' ? isSameLocalDay(tgl) : isSameLocalMonth(tgl);
  });

  const agg = {};
  txs.forEach(tx => {
    let items = tx.Detail_Item;
    if (typeof items === 'string'){
      try { items = JSON.parse(items); } catch(e){ items = []; }
    }
    if (!Array.isArray(items)) items = [];
    items.forEach(item => {
      const key = item.id || item.nama || 'unknown';
      if (!agg[key]){
        agg[key] = { id: key, nama: item.nama || '(tanpa nama)', qty: 0, total: 0 };
      }
      agg[key].qty += Number(item.qty) || 0;
      agg[key].total += (Number(item.harga) || 0) * (Number(item.qty) || 0);
    });
  });
  return Object.values(agg).sort((a,b) => b.qty - a.qty);
}

function openSalesDetailModal(){
  const range = state.chartRange;
  const label = range === 'daily' ? 'Hari Ini' : 'Bulan Ini';
  const products = getSoldProducts(range);

  const txsCount = state.transactions.filter(tx => {
    const tgl = String(tx.Tanggal || '');
    return range === 'daily' ? isSameLocalDay(tgl) : isSameLocalMonth(tgl);
  }).length;

  if (!products.length){
    const msg = txsCount > 0
      ? `Ada ${txsCount} transaksi ${label.toLowerCase()}, tapi detail item kosong.<br><small style="color:var(--muted)">Kemungkinan transaksi lama tersimpan sebelum fix header. Coba transaksi baru.</small>`
      : `Belum ada transaksi ${label.toLowerCase()}.`;
    openModal(`
      <h3>📦 Produk Terjual ${label}</h3>
      <div class="cart-empty">${msg}</div>
      <div class="modal-actions">
        <button class="skeuo-btn accent" onclick="closeModal()">Tutup</button>
      </div>
    `);
    return;
  }

  const totalQty = products.reduce((s,p) => s + p.qty, 0);
  const totalRev = products.reduce((s,p) => s + p.total, 0);
  const rows = products.map((p, i) => `
    <div class="sold-item">
      <div class="sold-rank">${i+1}</div>
      <div class="sold-info">
        <div class="sold-name">${escapeHtml(p.nama)}</div>
        <div class="sold-meta">${p.qty}× terjual</div>
      </div>
      <div class="sold-total">${formatRupiah(p.total)}</div>
    </div>
  `).join('');

  openModal(`
    <h3>📦 Produk Terjual ${label}</h3>
    <div class="sold-summary">
      <div class="sold-stat"><span>Item Terjual</span><strong>${totalQty}</strong></div>
      <div class="sold-stat"><span>Total Omzet</span><strong>${formatRupiah(totalRev)}</strong></div>
    </div>
    <div class="sold-list">${rows}</div>
    <div class="modal-actions">
      <button class="skeuo-btn accent" onclick="closeModal()">Tutup</button>
    </div>
  `);
}

/* ==========================================
   CHART
   ========================================== */
function renderChart(){
  const ctx = document.getElementById('salesChart').getContext('2d');
  let labels = [], values = [], labelText = '';

  if (state.chartRange === 'daily'){
    const dailyData = {};
    state.transactions.forEach(tx => {
      const key = localDateKey(tx.Tanggal);
      if (key) dailyData[key] = (dailyData[key]||0) + Number(tx.Total||0);
    });
    const days = [];
    for (let i=6; i>=0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(localDateKey(d));
    }
    labels = days.map(d => d.slice(5));
    values = days.map(d => dailyData[d] || 0);
    labelText = 'Penjualan 7 Hari Terakhir';
  } else {
    const monthlyData = {};
    state.transactions.forEach(tx => {
      const key = localMonthKey(tx.Tanggal);
      if (key) monthlyData[key] = (monthlyData[key]||0) + Number(tx.Total||0);
    });
    const months = [];
    for (let i=5; i>=0; i--){
      const d = new Date();
      d.setMonth(d.getMonth() - i);
      months.push(localMonthKey(d));
    }
    const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    labels = months.map(m => monthNames[parseInt(m.slice(5))-1] + ' ' + m.slice(2,4));
    values = months.map(m => monthlyData[m] || 0);
    labelText = 'Penjualan 6 Bulan Terakhir';
  }

  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff6b35';
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: labelText, data: values, backgroundColor: accent, borderRadius: 8, borderSkipped: false }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => 'Rp ' + v.toLocaleString('id-ID'), font: {size:10} } },
        x: { ticks: { font: {size:10} } }
      }
    }
  });
}

/* ==========================================
   PRODUK (KASIR)
   ========================================== */
function renderProducts(){
  const c = document.getElementById('product-list');
  let filtered = state.products;
  if (state.kasirCat !== 'all'){
    filtered = state.products.filter(p => String(p.Kategori||'').toLowerCase() === state.kasirCat.toLowerCase());
  }
  if (!filtered.length){
    c.innerHTML = '<div class="cart-empty" style="grid-column:1/-1;">Tidak ada produk di kategori ini.</div>';
    return;
  }
  c.innerHTML = filtered.map(p => `
    <div class="product-card" data-id="${p.ID}" data-nama="${escapeHtml(p.Nama)}" data-harga="${p.Harga}">
      <div class="p-name">${escapeHtml(p.Nama)}</div>
      <div class="p-price">${formatRupiah(p.Harga)}</div>
      ${p.Kategori ? `<div class="p-cat">${escapeHtml(p.Kategori)}</div>` : ''}
    </div>
  `).join('');
  c.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => {
      addToCart({
        id: card.dataset.id,
        nama: card.dataset.nama,
        harga: Number(card.dataset.harga)
      });
    });
  });
}

function addToCart({id, nama, harga}){
  const existing = state.cart.find(i => i.id === id);
  if (existing) existing.qty++;
  else state.cart.push({id, nama, harga, qty:1});
  renderCart();
}

function renderCart(){
  const list = document.getElementById('cart-items');
  if (!state.cart.length){
    list.innerHTML = '<li class="cart-empty">Belum ada item</li>';
  } else {
    list.innerHTML = state.cart.map((item, idx) => `
      <li>
        <div class="cart-item-info">
          <div>${escapeHtml(item.nama)}</div>
          <div style="font-size:.75rem;color:var(--muted);">${formatRupiah(item.harga)} × ${item.qty} = ${formatRupiah(item.harga*item.qty)}</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" data-action="minus" data-idx="${idx}">−</button>
          <span style="min-width:18px;text-align:center;font-weight:700;">${item.qty}</span>
          <button class="qty-btn" data-action="plus" data-idx="${idx}">+</button>
        </div>
      </li>
    `).join('');
    list.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        if (btn.dataset.action === 'plus') state.cart[idx].qty++;
        else {
          state.cart[idx].qty--;
          if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
        }
        renderCart();
      });
    });
  }
  const total = state.cart.reduce((s, i) => s + i.harga * i.qty, 0);
  document.getElementById('cart-total').textContent = formatRupiah(total);
}

/* ==========================================
   CHECKOUT
   ========================================== */
async function checkout(){
  if (!state.cart.length) return showToast('Keranjang kosong');
  if (!state.apiReady) return showToast('API belum terhubung. Periksa API_URL.');
  const total = state.cart.reduce((s, i) => s + i.harga * i.qty, 0);
  if (state.paymentMethod === 'Tunai') openCashPaymentModal(total);
  else await finalizeCheckout(total);
}

function openCashPaymentModal(total){
  const set = new Set();
  set.add(total);
  [10000, 20000, 50000, 100000].forEach(step => {
    const r = Math.ceil(total / step) * step;
    if (r > total) set.add(r);
  });
  const suggestions = [...set].sort((a,b) => a-b).slice(0, 5);

  openModal(`
    <h3>💵 Pembayaran Tunai</h3>
    <div class="cash-total-box">
      <span>Total</span><span class="amount">${formatRupiah(total)}</span>
    </div>
    <label for="cash-paid">Uang Diterima</label>
    <input type="text" id="cash-paid" class="skeuo-input" inputmode="numeric" placeholder="0" value="${formatNumberInput(suggestions[0] || total)}">
    <label>Saran Cepat</label>
    <div class="suggestion-row" id="suggestions">
      ${suggestions.map(s => `<button class="suggestion-btn" data-amount="${s}">${formatRupiah(s)}</button>`).join('')}
    </div>
    <div class="change-box">
      <span>Kembalian</span><span id="change-amount">Rp 0</span>
    </div>
    <div class="modal-actions">
      <button class="skeuo-btn" onclick="closeModal()">Batal</button>
      <button class="skeuo-btn accent" id="confirm-cash-btn">Konfirmasi</button>
    </div>
  `);

  const input = document.getElementById('cash-paid');
  const changeEl = document.getElementById('change-amount');
  const confirmBtn = document.getElementById('confirm-cash-btn');

  function updateChange(){
    const paid = parseNumberInput(input.value);
    const change = paid - total;
    changeEl.textContent = formatRupiah(change > 0 ? change : 0);
    changeEl.style.color = (paid >= total) ? '#10b981' : '#ef4444';
    confirmBtn.disabled = paid < total;
  }

  input.addEventListener('input', () => {
    const formatted = formatNumberInput(input.value);
    if (input.value !== formatted) input.value = formatted;
    updateChange();
  });
  document.querySelectorAll('#suggestions .suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = formatNumberInput(btn.dataset.amount);
      updateChange();
    });
  });
  confirmBtn.addEventListener('click', async () => {
    const paid = parseNumberInput(input.value);
    if (paid < total) return;
    closeModal();
    await finalizeCheckout(total, paid);
  });
  updateChange();
  setTimeout(() => input.focus(), 100);
}

async function finalizeCheckout(total, cashPaid){
  showLoading('Menyimpan transaksi...');
  const id = 'TRX' + Date.now();
  const payload = {
    ID_Transaksi: id,
    Total: total,
    Metode_Bayar: state.paymentMethod,
    Detail_Item: state.cart.map(i => ({ id: i.id, nama: i.nama, harga: i.harga, qty: i.qty }))
  };
  try{
    const res = await apiPost('saveTransaction', payload);
    if (res.success){
      let msg = `✅ ${state.paymentMethod} • ${formatRupiah(total)}`;
      if (cashPaid) msg += ` • Kembali ${formatRupiah(cashPaid - total)}`;
      showToast(msg, 4000);
      state.cart = [];
      renderCart();
      await loadTransactions();
      renderDashboard();
      renderChart();
    } else {
      showToast('Gagal: ' + (res.message || 'unknown'));
    }
  } finally { hideLoading(); }
}

function openProductModal(existing){
  const isEdit = !!existing;
  openModal(`
    <h3>${isEdit ? '✏️ Edit Produk' : '+ Tambah Produk'}</h3>
    <label>ID Produk</label>
    <input type="text" id="modal-id" class="skeuo-input" value="${isEdit ? existing.ID : 'P' + Date.now()}" ${isEdit ? 'readonly' : ''}>
    <label>Nama</label>
    <input type="text" id="modal-nama" class="skeuo-input" value="${isEdit ? escapeHtml(existing.Nama) : ''}" placeholder="Input Nama Menu">
    <label>Harga (Rp)</label>
    <input type="text" id="modal-harga" class="skeuo-input" inputmode="numeric" value="${isEdit ? formatNumberInput(existing.Harga) : ''}" placeholder="Input Harga Menu">
    <label>Kategori</label>
    <select id="modal-kategori" class="skeuo-input">
      <option value="Makanan" ${isEdit && existing.Kategori === 'Makanan' ? 'selected' : (!isEdit ? 'selected' : '')}>Makanan</option>
      <option value="Minuman" ${isEdit && existing.Kategori === 'Minuman' ? 'selected' : ''}>Minuman</option>
    </select>
    <div class="modal-actions">
      <button class="skeuo-btn" onclick="closeModal()">Batal</button>
      <button class="skeuo-btn accent" onclick="submitProduct(${isEdit})">Simpan</button>
    </div>
  `);
  const hargaInput = document.getElementById('modal-harga');
  hargaInput.addEventListener('input', () => {
    const formatted = formatNumberInput(hargaInput.value);
    if (hargaInput.value !== formatted) hargaInput.value = formatted;
  });
}

async function submitProduct(isEdit){
  const data = {
    ID: document.getElementById('modal-id').value.trim(),
    Nama: document.getElementById('modal-nama').value.trim(),
    Harga: parseNumberInput(document.getElementById('modal-harga').value),
    Kategori: document.getElementById('modal-kategori').value,
    Status: 'Aktif'
  };
  if (!data.ID || !data.Nama || isNaN(data.Harga) || data.Harga <= 0){
    return showToast('Lengkapi semua field dengan benar');
  }
  showLoading(isEdit ? 'Menyimpan perubahan...' : 'Menambahkan produk...');
  try{
    const res = await apiPost('saveProduct', data);
    if (res.success){
      showToast(isEdit ? '✅ Produk diperbarui' : '✅ Produk ditambahkan');
      closeModal();
      await loadProducts();
      renderProducts();
      renderMenu();
    } else {
      showToast('Gagal: ' + (res.message||'unknown'));
    }
  } finally { hideLoading(); }
}

window.editProduct = function(id){
  const p = state.products.find(x => x.ID === id);
  if (p) openProductModal(p);
};

window.deleteProduct = async function(id){
  if (!confirm('Hapus produk ini? Transaksi lama tidak terpengaruh.')) return;
  showLoading('Menghapus produk...');
  try{
    const res = await apiGet('deleteProduct', { id });
    if (res.success){
      showToast('🗑️ Produk dihapus');
      await loadProducts();
      renderProducts();
      renderMenu();
    } else {
      showToast('Gagal: ' + (res.message||'unknown'));
    }
  } finally { hideLoading(); }
};

/* ==========================================
   SETTINGS
   ========================================== */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
}

async function saveSettings(){
  const nama = document.getElementById('input-store-name').value.trim();
  const tema = document.getElementById('select-theme').value;
  if (!nama) return showToast('Nama toko wajib diisi');

  state.settings.Nama_Toko = nama;
  state.settings.Tema = tema;
  document.getElementById('store-name').textContent = nama;
  applyTheme(tema);
  applyAccent(state.settings.Accent || '#ff6b35');

  if (!state.apiReady){
    showToast('⚠️ Tersimpan lokal (API offline)');
    renderChart();
    return;
  }
  showLoading('Menyimpan pengaturan...');
  try{
    const res = await apiPost('saveSettings', {
      Nama_Toko: nama,
      Tema: tema,
      Accent: state.settings.Accent || '#ff6b35'
    });
    if (res.success) showToast('✅ Pengaturan disimpan');
    else showToast('Gagal: ' + (res.message||'unknown'));
  } finally { hideLoading(); }
  renderChart();
}
</script>
